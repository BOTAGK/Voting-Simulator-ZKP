services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./zkp_artifacts:/app/zkp_artifacts:ro

  zkp-setup:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.zkp
    volumes:
      - ./circuits:/workspace/circuits:ro
      - ./scripts/setup_zkp.sh:/workspace/scripts/setup_zkp.sh:ro
      - ./zkp_artifacts:/workspace/zkp_artifacts
